name: Build Portable Releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version label (for example v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  package-portable:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@12.10.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production bundle
        run: pnpm build

      - name: Install flat production dependencies for portable bundles
        run: |
          mkdir -p .tmp/prod-stage
          cp package.json pnpm-lock.yaml .tmp/prod-stage/
          printf 'nodeLinker: hoisted\n' > .tmp/prod-stage/pnpm-workspace.yaml
          pnpm --dir .tmp/prod-stage install --prod --frozen-lockfile --ignore-scripts

      - name: Determine release version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ inputs.version || 'v1.0.0' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package portable ZIP bundles (Windows, macOS, Linux)
        run: node scripts/package-portable.mjs --target all --version "${{ steps.meta.outputs.version }}" --node-modules .tmp/prod-stage/node_modules

      - name: Upload portable bundles as workflow artefacts
        uses: actions/upload-artifact@v4
        with:
          name: certflow-portable-${{ steps.meta.outputs.version }}
          path: release/*.zip

      - name: Attach portable ZIP bundles to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*.zip

  build-windows-installer:
    needs: package-portable
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows portable bundle
        uses: actions/download-artifact@v4
        with:
          name: certflow-portable-${{ needs.package-portable.outputs.version }}
          path: .tmp/portable

      - name: Extract Windows portable bundle
        shell: pwsh
        run: |
          $version = "${{ needs.package-portable.outputs.version }}"
          $zip = ".tmp/portable/CertFlow-$version-win-x64.zip"
          New-Item -ItemType Directory -Force -Path ".tmp/extracted" | Out-Null
          tar.exe -xf $zip -C ".tmp/extracted"

      - name: Build Windows Setup.exe with Inno Setup
        shell: pwsh
        run: |
          $version = "${{ needs.package-portable.outputs.version }}"
          $semver = $version.TrimStart('v')
          $sourceDir = (Resolve-Path ".tmp/extracted/CertFlow-$version-win-x64").Path
          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          $outputDir = (Resolve-Path "release").Path

          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            choco install innosetup -y --no-progress
          }
          if (-not (Test-Path $iscc)) {
            $cmd = Get-Command ISCC.exe -ErrorAction SilentlyContinue
            if ($cmd) { $iscc = $cmd.Source }
          }
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler (ISCC.exe) not found."
          }

          & $iscc `
            "/DMyAppVersion=$semver" `
            "/DMySourceDir=$sourceDir" `
            "/DMyOutputDir=$outputDir" `
            "/DMyOutputBaseFilename=CertFlow-$version-win-x64-Setup" `
            "installer\certflow.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Windows installer artefact
        uses: actions/upload-artifact@v4
        with:
          name: certflow-windows-installer-${{ needs.package-portable.outputs.version }}
          path: release/*-Setup.exe

      - name: Attach Windows installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*-Setup.exe
